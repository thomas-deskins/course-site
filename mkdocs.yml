site_name: Deskins Course Materials (DCM)
site_author: T. K. Deskins
site_description: Collection of materials for Dr. Deskins' courses.
copyright: 'Copyright &copy; <span id="copyright-year"></span> T. K. Deskins. Materials
  are available in accessible formats: see the <strong><a href="/accessibility/">accessibility
  page</a></strong> for details.'
extra_css:
  - stylesheets/extra.css
extra_js:
  - js/year.js
theme:
  name: material
  features:
    - navigation.tabs  # Top-level sections rendered as horizontal tabs
    - navigation.tabs.sticky # Keep tabs visible when scrolling
    - navigation.sections # Group pages into sidebar sections
    - navigation.expand # Expand all sidebar sections by default
    - navigation.prune # Hide unused/collapsed branches
    - navigation.indexes # Enable section index pages (index.md in folders)
    - navigation.instant # Instant page loads (SPA-like)
    - navigation.instant.prefetch # Prefetch pages on hover
    - navigation.instant.progress # Show progress bar on navigation
    - navigation.tracking # Update URL as you scroll
    - navigation.top # Back-to-top button
    - toc.integrate # Merge TOC into sidebar
    - toc.follow # Highlight current section in TOC
    - search.suggest # Autocomplete search suggestions
    - search.highlight # Highlight matches on pages
    - search.share # Share search queries via URL
    - content.code.copy # Copy button for code blocks
    - content.code.annotate # Inline code annotations
    - content.tabs.link # Sync tabs across pages
    - content.tooltips # Enable hover tooltips
    - header.autohide # Hide header on scroll
    - announce.dismiss # Dismissible announcement banner
